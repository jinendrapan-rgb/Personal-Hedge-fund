[project]
name = "greymatter"
version = "0.1.0"
description = "AI Hedge Fund — institutional L/S equity system on the S&P 500"
requires-python = "==3.11.*"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
